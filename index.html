<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Tesis UNI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Vista 1: Formulario de Login -->
      <section id="seccion-login" class="card">
        <h2>Iniciar Sesión</h2>
        <form id="formLogin">
          <div class="form-group">
            <label for="email">Correo Institucional:</label>
            <input
              type="email"
              id="email"
              required
              placeholder="admin@example.com"
            />
          </div>
          <div class="form-group">
            <label for="password">Contraseña:</label>
            <input
              type="password"
              id="password"
              required
              placeholder="********"
            />
          </div>
          <button type="submit" class="btn btn-primary">Ingresar</button>
        </form>
      </section>

      <!-- Vista 2: Panel de Líneas de Investigación (Oculto inicialmente) -->
      <section id="seccion-dashboard" class="card hidden">
        <header class="dashboard-header">
          <h2>Líneas de Investigación</h2>
          <!-- Tarea 4: Botón de Logout -->
          <button id="btnLogout" class="btn btn-danger">Cerrar Sesión</button>
        </header>

        <!-- Tarea 3: Formulario Asíncrono de Creación -->
        <form id="formCrearLinea" class="formulario-crear">
          <h3>Registrar Nueva Línea</h3>
          <div class="form-inline">
            <input
              type="text"
              id="nuevoNombre"
              placeholder="Nombre (ej. Robótica)"
              required
            />
            <input
              type="text"
              id="nuevoCodigo"
              placeholder="Código (ej. ROB-01)"
              required
            />
            <button type="submit" class="btn btn-success">Agregar Línea</button>
          </div>
        </form>

        <!-- Tarea 2: Spinner indicador de carga -->
        <div id="spinner" class="spinner hidden"></div>

        <!-- Contenedor dinámico donde se inyectan las líneas -->
        <div id="lista-lineas" class="grid-lineas"></div>
      </section>
    </div>

    <script src="main.js"></script>
  </body>
</html>
